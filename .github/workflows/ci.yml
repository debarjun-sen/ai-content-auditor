name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.1', '8.3' ]
    defaults:
      run:
        working-directory: ai-content-auditor
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, openssl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test:unit

  integration:
    name: Integration tests (wp-env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx wp-env start
      - run: npm run composer:install
      - run: npm run test:integration

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PHP syntax
        run: find ai-content-auditor ai-content-auditor-demo -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
      - name: JS syntax
        run: npm run lint:js
      - name: PHPCS (WordPress Coding Standards)
        working-directory: ai-content-auditor
        run: composer install --no-interaction --no-progress && composer lint
        continue-on-error: true

  build:
    name: Build zips
    runs-on: ubuntu-latest
    needs: [ unit ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zips
          path: dist/*.zip
